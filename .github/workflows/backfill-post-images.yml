name: Backfill post images

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Vuelve a descargar también las imágenes existentes."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download post images
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi
          python3 fetch_post_images.py "${args[@]}"

      - name: Commit images
        run: |
          if [ -z "$(git status --porcelain -- assets/posts)" ]; then
            echo "Sin cambios en assets/posts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/posts
          git commit -m "data: actualizar capturas de publicaciones"
          git push
