name: Fetch Meta insights

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Mes a descargar (YYYY-MM). Vacío = mes anterior."
        required: false
        type: string
      probe:
        description: "Solo comprobar permisos y métricas, sin guardar datos."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch insights
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          MONTH: ${{ inputs.month }}
          PROBE: ${{ inputs.probe }}
        run: |
          args=()
          if [ -n "$MONTH" ]; then
            args+=(--month "$MONTH")
          fi
          if [ "$PROBE" = "true" ]; then
            args+=(--probe)
          fi
          python3 fetch_meta.py "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: meta-archive
          path: data/archive/*.json
          if-no-files-found: ignore
          retention-days: 14
