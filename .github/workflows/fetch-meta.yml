name: Fetch Meta insights

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Mes a descargar (YYYY-MM). Vacío = mes anterior."
        required: false
        type: string
      probe:
        description: "Solo comprobar permisos y métricas, sin guardar datos."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fetch-meta
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch insights
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          MONTH: ${{ inputs.month }}
          PROBE: ${{ inputs.probe }}
        run: |
          args=()
          if [ -n "$MONTH" ]; then
            args+=(--month "$MONTH")
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/Lima date +%d)" != "01" ]; then
            args+=(--current)
          fi
          if [ "$PROBE" = "true" ]; then
            args+=(--probe)
          fi
          python3 fetch_meta.py "${args[@]}"

          if [ "$PROBE" != "true" ] && [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/Lima date +%d)" = "01" ]; then
            python3 fetch_meta.py --current
          fi

      - name: Fetch post images
        if: ${{ inputs.probe != true }}
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
        run: python3 fetch_post_images.py

      - name: Commit archive and images
        if: ${{ github.event_name == 'schedule' || inputs.probe != true }}
        run: |
          if [ -z "$(git status --porcelain -- data/archive assets/posts)" ]; then
            echo "Sin cambios en data/archive ni assets/posts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive assets/posts
          git commit -m "data: actualizar archivo Meta"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: meta-archive
          path: data/archive/*.json
          if-no-files-found: ignore
          retention-days: 14
